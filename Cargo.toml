[workspace]
resolver = "3"
members = ["crates/*"]
# Crates with registry deps live in their own workspace until the GPT sandbox (no network) is done building.
exclude = ["crates/difftest"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"

[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
codegen-units = 1
lto = "thin"
debug = "line-tables-only"

[profile.bench]
inherits = "release"
