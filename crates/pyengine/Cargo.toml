[package]
name = "pyengine"
description = "Python training interface (PyO3 + maturin) for the numbrion engine: fixed action space, masks, batched environments"
edition.workspace = true
version.workspace = true
license.workspace = true

[lib]
# The cdylib is the Python extension module `numbrion._numbrion` (see pyproject.toml); the rlib lets the
# pure-Rust test-suite and benchmarks link the same code without Python.
name = "_numbrion"
crate-type = ["cdylib", "rlib"]

[features]
default = []
# Everything that touches Python. `maturin develop/build` enables it (pyproject.toml); plain `cargo build/test`
# does not, so the Rust tests never need libpython.
python = ["dep:pyo3", "dep:numpy"]

[dependencies]
engine = { path = "../engine" }
rayon = "1"
flate2 = "1"
pyo3 = { version = "0.29", features = ["abi3-py39", "extension-module"], optional = true }
numpy = { version = "0.29", optional = true }
