<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Numbrion advisor</title>
<style>
  body { font: 13px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 14px 16px; min-width: 320px; max-width: 560px; color: #1d2230; }
  h1 { font-size: 15px; margin: 0 0 10px; }
  label { display: block; margin: 9px 0 3px; font-weight: 600; }
  .row { display: flex; gap: 8px; align-items: center; }
  input[type=text], input[type=number], select { width: 100%; box-sizing: border-box; padding: 5px 7px; border: 1px solid #b9c0d0; border-radius: 5px; font: inherit; }
  .check { display: flex; gap: 6px; align-items: center; font-weight: 400; margin: 6px 0; }
  .hint { color: #687089; font-size: 11.5px; margin-top: 2px; }
  button { font: inherit; padding: 5px 12px; border-radius: 5px; border: 1px solid #3d7be0; background: #3d7be0; color: white; cursor: pointer; }
  button.secondary { background: white; color: #3d7be0; }
  #status { margin-top: 10px; padding: 8px 10px; border-radius: 6px; background: #f1f3f8; white-space: pre-wrap; font-size: 12px; min-height: 1.4em; }
  #status.ok { background: #e6f6ea; color: #1f6a37; }
  #status.error { background: #fbe9e9; color: #8a2424; }
  #saved { color: #1f6a37; font-size: 12px; margin-left: 6px; }
  .advisor { border: 1px solid #b9c0d0; background: #f7f8fb; border-radius: 6px; padding: 10px; margin-bottom: 12px; }
  .advisor .caption { font-size: 11px; color: #687089; }
  #currentModel { font-size: 14px; font-weight: 700; overflow-wrap: anywhere; margin: 2px 0; }
  #currentBot { font-size: 12px; color: #687089; overflow-wrap: anywhere; }
  #searchStatus { display: inline-block; font-weight: 600; font-size: 12px; border-radius: 4px; padding: 2px 6px; margin-top: 7px; background: #e7eaf0; }
  #searchStatus.ok { background: #e6f6ea; color: #1f6a37; }
  #searchStatus.error { background: #fbe9e9; color: #8a2424; }
  #searchDetail { overflow-wrap: anywhere; }
</style>
</head>
<body>
  <h1>Numbrion advisor</h1>
  <section class="advisor" aria-label="Current model and search" aria-live="polite">
    <div class="caption">Current model</div>
    <div id="currentModel">Checking model…</div>
    <div id="currentBot">Advisor: server default</div>
    <div id="searchStatus">Search status unknown</div>
    <div id="searchDetail" class="hint">Checking the API…</div>
  </section>
  <label class="check"><input type="checkbox" id="enabled"> Enabled</label>
  <label class="check"><input type="checkbox" id="autoAdvise"> Auto-advise every new request</label>
  <label class="check"><input type="checkbox" id="showBotLog"> Show the bot log</label>

  <label for="apiUrl">Advisor API URL</label>
  <input type="text" id="apiUrl" placeholder="http://127.0.0.1:8765" spellcheck="false">
  <div class="hint">The play server's HTTP API (crates/pyengine/play/server.py, --api-port).</div>

  <label for="budgetMs">Search budget (ms)</label>
  <input type="number" id="budgetMs" min="0" step="100" placeholder="server default">

  <label for="bot">Advisor bot</label>
  <select id="bot"><option value="">server default</option></select>

  <div class="row" style="margin-top: 12px">
    <button id="check">Check API</button>
    <button id="reset" class="secondary">Defaults</button>
    <span id="saved"></span>
  </div>
  <div id="status" role="status" aria-live="polite"></div>

  <script src="src/settings.js"></script>
  <script src="src/advisor-status.js"></script>
  <script src="src/options.js"></script>
</body>
</html>
